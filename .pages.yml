content:
  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: bio
        label: Bio
        type: text
      - name: avatar
        label: Avatar Image
        type: image
      - name: location
        label: Location
        type: string
      - name: email
        label: Email
        type: string
      - name: socialLinks
        label: Social Links
        type: object
        list: true
        fields:
          - name: platform
            label: Platform
            type: string
          - name: url
            label: URL
            type: string

  - name: homepage
    label: Homepage
    type: file
    path: src/data/homepage.json
    format: json
    fields:
      - name: heroTitle
        label: Hero Title
        type: string
        required: true
      - name: heroSubtitle
        label: Hero Subtitle
        type: text
      - name: headline
        label: Headline
        type: string
      - name: description
        label: Description
        type: text
      - name: seoTitle
        label: SEO Title
        type: string
      - name: seoDescription
        label: SEO Description
        type: text
  - name: tags
    label: Tags
    type: collection
    path: src/data/tags
    format: json
    filename: "{name}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: category
        label: Category
        type: string

  - name: photos
    label: Photos
    type: collection
    path: src/data/photos
    format: json
    filename: "{label}.json"
    view:
      primary: label
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: URL
        label: URL
        type: string
        required: true
      - name: tags
        label: Tags
        type: list
        field:
          type: string
      - name: related
        label: Related
        type: select
        options:
          - yoga
          - engineering
          - other

  - name: videos
    label: Videos
    type: collection
    path: src/data/videos
    format: json
    filename: "{label}.json"
    view:
      primary: label
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: URL
        label: URL
        type: string
        required: true
      - name: tags
        label: Tags
        type: list
        field:
          type: string
      - name: related
        label: Related
        type: select
        options:
          - yoga
          - engineering
          - other

  - name: articles
    label: Articles
    type: collection
    path: src/data/articles
    format: yaml-frontmatter
    filename: "{primary}.mdoc"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: visible
        label: Visible
        type: boolean
        default: true
      - name: pubDate
        label: Publication Date
        type: date
      - name: thumbnail
        label: Thumbnail
        type: image
      - name: tags
        label: Tags
        type: list
        required: true
        field:
          type: string
      - name: body
        label: Content Body
        type: rich-text
        options:
          format: markdown

  - name: categories
    label: Categories
    type: collection
    path: src/data/categories
    format: json
    filename: "{name}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true

  - name: projects
    label: Projects
    type: collection
    path: src/data/projects
    format: yaml-frontmatter
    filename: "{primary}.mdoc"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: shortDescription
        label: Short Description
        type: text
        required: true
      - name: visible
        label: Visible
        type: boolean
        default: false
      - name: isMajorProject
        label: Is Major Project
        type: boolean
        default: false
      - name: githubURL
        label: GitHub URL
        type: string
      - name: websiteURL
        label: Website URL
        type: string
      - name: body
        label: Content Body
        type: rich-text
        options:
          format: markdown

  - name: certificates
    label: Certificates
    type: collection
    path: src/data/certificates
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: issuedBy
        label: Issued By
        type: string
        required: true
      - name: issuerURL
        label: Issuer URL
        type: string
      - name: issueDate
        label: Issue Date
        type: date
        required: true
      - name: certificateURL
        label: Certificate URL
        type: string
      - name: credentialID
        label: Credential ID
        type: string
      - name: related
        label: Related
        type: select
        options:
          - yoga
          - engineering
          - other

  - name: workExperience
    label: Work Experience
    type: collection
    path: src/data/work-experience
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Job Title
        type: string
        required: true
      - name: company
        label: Company
        type: string
        required: true
      - name: companyURL
        label: Company URL
        type: string
      - name: employmentType
        label: Employment Type
        type: select
        required: true
        options:
          - Full-time
          - Part-time
          - Contract
          - Freelance
          - Internship
      - name: locationType
        label: Location Type
        type: select
        required: true
        options:
          - Remote
          - On-site
          - Hybrid
      - name: startDate
        label: Start Date
        type: date
        required: true
      - name: endDate
        label: End Date
        type: date
      - name: isCurrent
        label: Is Current Role
        type: boolean
        default: false
      - name: duration
        label: Duration
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: githubURL
        label: GitHub URL
        type: string
      - name: websiteURL
        label: Website URL
        type: string
      - name: technologies
        label: Technologies
        type: string
        list: true
        required: true
      - name: certificates
        label: Certificates
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: file
            label: File
            type: string

  - name: knowledgeSeries
    label: Knowledge Series
    type: collection
    path: src/data/knowledge-series
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: start_date
        label: Start Date
        type: date
        required: true
      - name: end_date
        label: End Date
        type: date
      - name: description
        label: Description
        type: text
        required: true
      - name: topics
        label: Topics
        type: string
        list: true
        required: true
      - name: join_url
        label: Join URL
        type: string

  - name: yogaSessions
    label: Yoga Sessions
    type: collection
    path: src/data/yoga-sessions
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: style
        label: Style
        type: select
        required: true
        options:
          - Hatha
          - Pranayama
          - Vinyasa
          - Ashtanga
          - Yin
          - Kundalini
          - Restorative
          - Mixed
          - Other
      - name: level
        label: Level
        type: select
        required: true
        options:
          - Beginner
          - Intermediate
          - Advanced
          - All Levels
      - name: location_type
        label: Location Type
        type: select
        required: true
        options:
          - Online
          - In-person
          - Hybrid
      - name: venue
        label: Venue
        type: string
      - name: schedule
        label: Schedule
        type: string
        required: true
      - name: duration
        label: Duration
        type: string
        required: true
      - name: start_date
        label: Start Date
        type: date
        required: true
      - name: end_date
        label: End Date
        type: date
      - name: description
        label: Description
        type: text
      - name: practices
        label: Practices
        type: string
        list: true
        required: true
      - name: instructors
        label: Instructors
        type: string
        list: true
      - name: join_url
        label: Join URL
        type: string