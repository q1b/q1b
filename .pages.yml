media:
  - name: images
    label: Images
    input: src/assets/images
    output: /src/assets/images
    categories: [image]
    extensions: [png, jpg, jpeg, webp, svg]

  - name: docs
    label: Documents & PDFs
    input: src/assets/files
    output: /src/assets/files
    categories: [document]
    extensions: [pdf]

  # Optional: Only needed if uploading local video files
  # - name: videos only YOUTUBE videos for now
  #   label: Video Files
  #   input: src/assets/videos
  #   output: /src/assets/videos
  #   categories: [video]
  #   extensions: [mp4, webm, mov]
content:
  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: image
        label: Profile Image
        type: image
        options:
          media: images
          path: profile # Saved inside src/assets/images/profile

      - name: worksFor
        label: Works For
        type: object
        fields:
          - name: discriminant
            label: Enable Employer Info
            type: boolean
          - name: value
            label: Employer Details
            type: object
            fields:
              - name: name
                label: Employer Name
                type: string
              - name: URL
                label: Employer URL
                type: string

      - name: knowsAbout
        label: Knows About
        type: object
        list: true
        fields:
          - name: name
            label: Skill / Topic
            type: string
          - name: public
            label: Publicly Visible
            type: boolean

      - name: githubURL
        label: GitHub URL
        type: string

      - name: linkedInURL
        label: LinkedIn URL
        type: string

      - name: resumePDF
        label: Resume PDF
        type: file
        options:
          media: docs
          path: resume # Saved inside src/assets/files/resume
  - name: homepage
    label: Homepage
    type: file
    path: src/data/homepage.json
    format: json
    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Meta / Hero Description
        type: text
        required: true

      - name: highlights
        label: Highlights
        type: string
        list: true
        required: true
  - name: tags
    label: Tags
    type: collection
    path: src/data/tags
    format: json
    filename: "{name}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: category
        label: Category
        type: reference
        options:
          collection: categories
          value: name # Stores the category's 'name' property in the JSON

  - name: photos
    label: Photos
    type: collection
    path: src/data/photos
    format: json
    filename: "{label}.json"
    view:
      primary: label
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: URL
        label: Photo File
        type: image
        required: true
        options:
          media: images
          path: photos # Saves uploads to src/assets/images/photos
      - name: tags
        label: Tags
        type: string
        list: true
      - name: related
        label: Related
        type: select
        options:
          - yoga
          - engineering
          - other

  - name: videos
    label: Videos
    type: collection
    path: src/data/videos
    format: json
    filename: "{label}.json"
    view:
      primary: label
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: URL
        label: URL
        type: string
        required: true
      - name: tags
        label: Tags
        type: list
        field:
          type: string
      - name: related
        label: Related
        type: select
        options:
          - yoga
          - engineering
          - other

  - name: articles
    label: Articles
    type: collection
    path: src/data/articles
    format: yaml-frontmatter
    filename: "{primary}.mdoc"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: visible
        label: Visible
        type: boolean
        default: true
      - name: pubDate
        label: Publication Date
        type: date
      - name: thumbnail
        label: Thumbnail
        type: image
        options:
          media: images
          path: articles
      - name: tags
        label: Tags
        type: reference
        list: true
        required: true
        options:
          collection: tags
          value: name
      - name: body
        label: Content Body
        type: rich-text
        options:
          format: markdown

  - name: categories
    label: Categories
    type: collection
    path: src/data/categories
    format: json
    filename: "{name}.json"
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true

  - name: projects
    label: Projects
    type: collection
    path: src/data/projects
    format: yaml-frontmatter
    filename: "{primary}.mdoc"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: shortDescription
        label: Short Description
        type: text
        required: true
      - name: visible
        label: Visible
        type: boolean
        default: false
      - name: isMajorProject
        label: Is Major Project
        type: boolean
        default: false
      - name: githubURL
        label: GitHub URL
        type: string
      - name: websiteURL
        label: Website URL
        type: string
      - name: body
        label: Content Body
        type: rich-text
        options:
          format: markdown

  - name: certificates
    label: Certificates
    type: collection
    path: src/data/certificates
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: issuedBy
        label: Issued By
        type: string
        required: true
      - name: issuerURL
        label: Issuer URL
        type: string
      - name: issueDate
        label: Issue Date
        type: date
        required: true
      - name: certificateURL
        label: Certificate URL
        type: string
      - name: credentialID
        label: Credential ID
        type: string
      - name: related
        label: Related
        type: select
        options:
          - yoga
          - engineering
          - other

  - name: workExperience
    label: Work Experience
    type: collection
    path: src/data/work-experience
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Job Title
        type: string
        required: true
      - name: company
        label: Company
        type: string
        required: true
      - name: companyURL
        label: Company URL
        type: string
      - name: employmentType
        label: Employment Type
        type: select
        required: true
        options:
          - Full-time
          - Part-time
          - Contract
          - Freelance
          - Internship
      - name: locationType
        label: Location Type
        type: select
        required: true
        options:
          - Remote
          - On-site
          - Hybrid
      - name: startDate
        label: Start Date
        type: date
        required: true
      - name: endDate
        label: End Date
        type: date
      - name: isCurrent
        label: Is Current Role
        type: boolean
        default: false
      - name: duration
        label: Duration
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: githubURL
        label: GitHub URL
        type: string
      - name: websiteURL
        label: Website URL
        type: string
      - name: technologies
        label: Technologies
        type: string
        list: true
        required: true
      - name: certificates
        label: Certificates
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: file
            label: File
            type: string

  - name: knowledgeSeries
    label: Knowledge Series
    type: collection
    path: src/data/knowledge-series
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: start_date
        label: Start Date
        type: date
        required: true
      - name: end_date
        label: End Date
        type: date
      - name: description
        label: Description
        type: text
        required: true
      - name: topics
        label: Topics
        type: string
        list: true
        required: true
      - name: join_url
        label: Join URL
        type: string

  - name: yogaSessions
    label: Yoga Sessions
    type: collection
    path: src/data/yoga-sessions
    format: json
    filename: "{primary}.json"
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: style
        label: Style
        type: select
        required: true
        options:
          - Hatha
          - Pranayama
          - Vinyasa
          - Ashtanga
          - Yin
          - Kundalini
          - Restorative
          - Mixed
          - Other
      - name: level
        label: Level
        type: select
        required: true
        options:
          - Beginner
          - Intermediate
          - Advanced
          - All Levels
      - name: location_type
        label: Location Type
        type: select
        required: true
        options:
          - Online
          - In-person
          - Hybrid
      - name: venue
        label: Venue
        type: string
      - name: schedule
        label: Schedule
        type: string
        required: true
      - name: duration
        label: Duration
        type: string
        required: true
      - name: start_date
        label: Start Date
        type: date
        required: true
      - name: end_date
        label: End Date
        type: date
      - name: description
        label: Description
        type: text
      - name: practices
        label: Practices
        type: string
        list: true
        required: true
      - name: instructors
        label: Instructors
        type: string
        list: true
      - name: join_url
        label: Join URL
        type: string